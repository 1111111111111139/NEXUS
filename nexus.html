  _sendTravelerMsg: function(travelerId) {
    var input = document.getElementById('traveler-chat-input');
    if (!input) return;
    var text = input.value.trim();
    if (!text) return;
    input.value = '';

    var chat = Store.getOrCreateChat(travelerId);
    chat.messages.push({ from: 'player', content: text, time: Date.now() });

    // Refresh modal
    this._openTravelerChat(travelerId);

    // Get AI response
    var t = Store.traveler(travelerId);
    if (!t || !t.online) {
      chat.messages.push({ from: 'traveler', content: '（当前不在线）', time: Date.now() });
      Store.save();
      this._openTravelerChat(travelerId);
      return;
    }

    var self = this;
    var sysMsg = buildTravelerChatPrompt(t);
    var messages = [{ role: 'system', content: sysMsg }];
    // Add recent chat context
    chat.messages.slice(-10).forEach(function(m) {
      messages.push({ role: m.from === 'player' ? 'user' : 'assistant', content: m.content });
    });

    AI.call(messages, { temperature: 0.9, maxTokens: 512 }).then(function(resp) {
      var reply = (resp && resp.ok) ? resp.text.trim() : '（信号中断...）';
      chat.messages.push({ from: 'traveler', content: reply, time: Date.now() });
      Store.save();
      self._openTravelerChat(travelerId);
    });
  },

  escapeHtml: function(str) {
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  },

  /** Format text for display: auto-detect （parenthetical actions）→ italic action-text */
  formatContent: function(text) {
    var self = this;
    var lines = text.split('\n');
    var result = lines.map(function(line) {
      var html = '';
      var re = /([（(][^）)]*[）)])/g;
      var lastIdx = 0, m;
      while ((m = re.exec(line)) !== null) {
        if (m.index > lastIdx) html += self.escapeHtml(line.slice(lastIdx, m.index));
        html += '<span class="action-text">' + self.escapeHtml(m[1]) + '</span>';
        lastIdx = m.index + m[1].length;
      }
      if (lastIdx < line.length) html += self.escapeHtml(line.slice(lastIdx));
      return html || self.escapeHtml(line);
    });
    return result.join('<br>');
  },

  /** Split text into actions (lines starting with （([【) and dialogue */
  parseContent: function(text) {
    var lines = text.split('\n');
    var actions = [];
    var dialogue = [];
    lines.forEach(function(line) {
      var trimmed = line.trim();
      if (/^[（(【\[]/.test(trimmed)) { actions.push(trimmed); }
      else if (trimmed) { dialogue.push(trimmed); }
    });
    return { actions:actions, dialogue:dialogue };
  },

  /** Format player message: inline action parentheses → action-inline */
  formatUserMsg: function(text) {
    var html = '';
    var re = /([（(][^）)]*[）)])|([""][^""]*[""])|([^（(""']+)/g;
    var m;
    while ((m = re.exec(text)) !== null) {
      if (m[1]) { html += '<span class="msg-action-inline">' + this.escapeHtml(m[1]) + '</span>'; }
      else if (m[2]) { html += this.escapeHtml(m[2]); }
      else if (m[3]) { html += this.escapeHtml(m[3]); }
    }
    return html || this.escapeHtml(text);
  },

      '黑色短发，眼神锐利，左眉尾有一道浅疤',
      '长发及腰，面容清冷，不常笑但笑起来很好看',
      '普通相貌，但目光深邃，让人忍不住多看两眼',
      '戴着细框眼镜，书卷气十足，手指上有旧墨渍',
      '利落马尾，小麦色皮肤，一看就常在外面跑',
      '微卷中长发，总是漫不经心的表情，嘴角习惯性微翘'
    ];
    var backgrounds = [
      '前公司社畜，在某次深夜加班时被主神召唤',
      '退役特种兵，战斗经验丰富但不爱提过去',
      '自由职业插画师，对色彩和细节异常敏感',
      '网络小说作家，对穿书设定有种微妙的既视感',
      '医院急诊科医生，习惯了高压和混乱',
      '大学生，专业是没什么用的古典文学',
      '前餐厅主厨，刀工极好，性格比刀还利'
    ];
    var traits = ['活泼','冷静','温柔','毒舌','神秘'];

    var p = Store.player();
    p.name = names[Math.floor(Math.random() * names.length)];
    p.appearance = appearances[Math.floor(Math.random() * appearances.length)];
    p.background = backgrounds[Math.floor(Math.random() * backgrounds.length)];
    p.personality = traits[Math.floor(Math.random() * traits.length)];
    p.points = 100;
    Store.save();
    document.getElementById('center-modal').classList.remove('open');
    Store.addMessage({ type:'system', content:'穿越者「' + p.name + '」已登录NEXUS主神空间。' });
    Store.addMessage({ type:'narrative', content:'你站在一片纯白的空间中。脚下没有地面，头顶没有天空——只有无限延伸的白，和远处悬浮着的一扇扇门。每扇门后面是一个世界。一本书。一个等待你进入的故事。\n\n主神空间的终端在你眼前展开。积分商店。穿越者通讯录。副本记录。一切准备就绪。\n\n（你可以先去积分商店看看，或者直接从副本记录中进入你的第一个世界）' });
    this.renderAll();
    this.renderStatus();
    this._showToast('穿越者 ' + p.name + ' 已登录NEXUS · 性格：' + p.personality);
  },

  _aiRandomChar: function() {
    var self = this;
    var btn = document.getElementById('cc-ai-btn');
    if (!btn) return;
    btn.textContent = '生成中...';
    btn.disabled = true;

    var prompt = '请随机生成一个穿越者角色。穿越者是被主神空间召唤进入不同小说世界执行任务的人。返回纯JSON格式：\n' +
      '{"name":"中文名(2-3字)","gender":"女","appearance":"外貌描述(1-2句)","background":"穿越前的背景故事(1-2句)","personality":"活泼/冷静/温柔/毒舌/神秘(五选一)","personalityDesc":"性格特征的一句话描述"}\n只返回JSON。';

    AI.call([{ role:'user', content:prompt }], { temperature:1.2, maxTokens:300 }).then(function(resp) {
      btn.textContent = 'AI随机';
      btn.disabled = false;
      if (!resp || resp.error) { self._randomChar(); return; }
      try {
        var jsonStr = resp.text.trim();
        var idx = jsonStr.indexOf('{');
        if (idx > 0) jsonStr = jsonStr.slice(idx);
        idx = jsonStr.lastIndexOf('}');
        if (idx >= 0) jsonStr = jsonStr.slice(0, idx + 1);
        var data = JSON.parse(jsonStr);

        // Fill form fields
        var nameEl = document.getElementById('cc-name');
        var appEl = document.getElementById('cc-appearance');
        var bgEl = document.getElementById('cc-background');
        var persEl = document.getElementById('cc-personality');
        if (nameEl) nameEl.value = data.name || '';
        if (appEl) appEl.value = data.appearance || '';
        if (bgEl) bgEl.value = data.background || '';
        // Set personality radio
        var trait = data.personality || '神秘';
        if (persEl) persEl.value = trait;
        var btns = document.querySelectorAll('.cc-trait-btn');
        btns.forEach(function(b) {
          if (b.dataset.trait === trait) {
            b.style.borderColor = 'var(--accent)';
            b.style.color = 'var(--accent)';
            b.style.background = 'var(--accent-dim)';
          }
        });
        self._showToast('AI生成了穿越者：' + (data.name || '?') + ' · ' + trait);
      } catch(e) { self._randomChar(); }
    });
  }
};

/* ============================================================
   BOOTSTRAP
   ============================================================ */
document.addEventListener('DOMContentLoaded', function() { App.init(); });
</script>
